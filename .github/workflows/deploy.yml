name: Deploy to GitHub Pages

on:
  # main 브랜치에 코드가 push될 때 자동 배포
  push:
    branches: ["main"]

  # GitHub Actions 탭에서 언제든 수동으로 배포를 트리거할 수 있도록 지원
  workflow_dispatch:

# GITHUB_TOKEN에 GitHub Pages 배포 권한 부여
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 제어 (진행 중인 배포는 취소하지 않고 대기)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static assets to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
