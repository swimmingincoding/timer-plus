name: Deploy to GitHub Pages

on:
  # main 브랜치에 코드가 push될 때 자동 배포
  push:
    branches: ["main"]

  # GitHub Actions 탭에서 언제든 수동으로 배포를 트리거할 수 있도록 지원
  workflow_dispatch:

# GITHUB_TOKEN에 GitHub Pages 배포 권한 부여
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 제어 (진행 중인 배포는 취소하지 않고 대기)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. 아티팩트 패키징 및 업로드 잡 (단일 잡 내 아티팩트 인덱싱 레이스 컨디션 방지)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static assets to Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  # 2. 업로드 완료가 확정된 후 실행되는 배포 잡
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
